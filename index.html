<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой первый шаг к квартире</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #2c3e50; font-size: 24px; text-align: center; margin-top: 0; }
        p.subtitle { color: #7f8c8d; text-align: center; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 6px; margin-bottom: 8px; color: #34495e; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #3498db; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            text-align: center;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover { background-color: #2980b9; }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #2ecc71;
            border-radius: 4px;
            display: none;
        }
        .result-title { font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .result-val { font-size: 20px; color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Копим на квартиру 🏠</h1>
        <p class="subtitle">Рассчитай план накоплений на первоначальный взнос за 1 минуту</p>
        
        <div class="form-group">
            <label for="price">Желаемая стоимость квартиры (руб):</label>
            <input type="number" id="price" placeholder="Например, 6000000" value="5000000">
        </div>

        <div class="form-group">
            <label for="years">За сколько лет нужно накопить?</label>
            <input type="number" id="years" placeholder="Например, 3" value="3">
        </div>

        <button class="btn" onclick="calculateGoal()">Построить план</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">Размер взноса (20%): <span id="vznosSum">0</span> руб.</div>
            <div>Нужно откладывать ежемесячно:</div>
            <div class="result-val"><span id="monthlySum">0</span> руб./мес.</div>
        </div>
    </div>

    <script>
        function calculateGoal() {
            const price = parseFloat(document.getElementById('price').value);
            const years = parseFloat(document.getElementById('years').value);
            
            if (!price || !years || price <= 0 || years <= 0) {
                alert('Пожалуйста, введите корректные данные');
                return;
            }

            const vznos = price * 0.20;
            const months = years * 12;
            const monthlyPay = vznos / months;

            document.getElementById('vznosSum').innerText = Math.round(vznos).toLocaleString('ru-RU');
            document.getElementById('monthlySum').innerText = Math.round(monthlyPay).toLocaleString('ru-RU');
            
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>

</body>
</html>
